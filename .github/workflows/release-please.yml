name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to (re-)build and push images for
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  push-release-images:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.version }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: rosalindfranklininstitute+github_antigenapp
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/rosalindfranklininstitute/antigen-app-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},prefix=v,value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,value=${{ env.TAG_NAME }},enable=${{ !contains(env.RELEASE_VERSION, '-') }}
            type=semver,pattern={{major}},prefix=v,value=${{ env.TAG_NAME }},enable=${{ !contains(env.RELEASE_VERSION, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_VERSION, '-') }}

      - name: Resolve component build args
        id: build-args
        run: |
          if [ "$COMPONENT" = "frontend" ]; then
            printf 'value=VITE_SENTRY_DSN=%s\n' "$FRONTEND_SENTRY_DSN" >> "$GITHUB_OUTPUT"
          fi
        env:
          COMPONENT: ${{ matrix.component }}
          FRONTEND_SENTRY_DSN: ${{ secrets.FRONTEND_SENTRY_DSN }}

      - name: Build and push prod image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.component }}
          target: prod
          build-args: ${{ steps.build-args.outputs.value }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
