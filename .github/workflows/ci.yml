name: Build, test and push dev container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-dev-${{ github.ref }}-${{ matrix.component }}
      cancel-in-progress: true
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      IMAGE_BASE: quay.io/rosalindfranklininstitute/antigen-app-${{ matrix.component }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: quay.io
          username: rosalindfranklininstitute+github_antigenapp
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Build dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          target: dev
          build-args: |
            UV_SYNC_FLAGS=
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: ${{ env.IMAGE_BASE }}:dev

      - name: Run backend lint
        if: ${{ matrix.component == 'backend' }}
        run: |
          docker run --rm "${IMAGE_BASE}:dev" sh -c "ruff check . && ruff format --check ."

      - name: Run backend tests
        if: ${{ matrix.component == 'backend' }}
        run: |
          docker run --name backend-tests -e DJANGO_CI=true "${IMAGE_BASE}:dev" python -m pytest
          docker cp backend-tests:/usr/src/cov.xml ./backend/cov.xml
          docker rm backend-tests

      - name: Upload backend coverage to Codecov
        if: ${{ matrix.component == 'backend' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/cov.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run frontend tests
        if: ${{ matrix.component == 'frontend' }}
        run: |
          docker run --name frontend-tests -e CI=true "${IMAGE_BASE}:dev" sh -c "npx vitest run --coverage && npx prettier --check ."
          docker cp frontend-tests:/antigenapp/coverage/lcov.info ./frontend/lcov.info
          docker rm frontend-tests

      - name: Upload frontend coverage to Codecov
        if: ${{ matrix.component == 'frontend' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./frontend/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          target: prod
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: ${{ env.IMAGE_BASE }}:prod-test

      - name: Smoke test backend prod image (read-only, non-root)
        if: ${{ matrix.component == 'backend' }}
        run: |
          docker run -d --name prod-test --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 \
            -e UWSGI_THREADS=2 -e UWSGI_PROCESSES=1 -e UWSGI_OFFLOAD_THREADS=2 \
            -e UWSGI_MODULE=antigendjango.wsgi:application \
            -e DJANGO_DEBUG=false -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DJANGO_USE_SQLITE=true -e DJANGO_SECRET_KEY=ci-only \
            "${IMAGE_BASE}:prod-test"
          curl -sf --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8080/api/ > /dev/null \
            || { docker logs prod-test; exit 1; }
          test "$(docker exec prod-test id -u)" = 10191
          docker exec prod-test python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:1717')"

      - name: Smoke test frontend prod image (read-only, non-root)
        if: ${{ matrix.component == 'frontend' }}
        run: |
          docker run -d --name prod-test --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 \
            -e ENVIRONMENT=staging "${IMAGE_BASE}:prod-test"
          curl -sf --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/ > page.html \
            || { docker logs prod-test; exit 1; }
          grep -q 'window._environment = "staging"' page.html
          grep -q '<html lang="en" class="preproduction ' page.html
          test "$(docker exec prod-test id -u)" != 0

      - name: Push dev image tags
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push "${IMAGE_BASE}:dev"
