---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: antigen-prod-frontend
  name: antigen-prod-frontend
  namespace: antigenapp
spec:
  selector:
    matchLabels:
      k8s-app: antigen-prod-frontend
  template:
    metadata:
      labels:
        k8s-app: antigen-prod-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - image: ...
          imagePullPolicy: Always
          name: frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          env:
            - name: ENVIRONMENT
              value: ...
